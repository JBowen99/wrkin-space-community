# Production / self-hosted compose stack.
#
# Builds the app from source, then runs:
#   Postgres, MinIO, migrate, app, collab, Caddy
#
# Usage (first time):
#   cp .env.production.example .env.production
#   # edit DOMAIN, secrets, etc.
#   docker compose --env-file .env.production up -d --build
#
# Subsequent starts:
#   docker compose --env-file .env.production up -d

name: wrkin-community

x-app-env: &app-env
  NODE_ENV: production
  HOST: 0.0.0.0
  ORIGIN: ${ORIGIN}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  COLLAB_JWT_SECRET: ${COLLAB_JWT_SECRET:-${BETTER_AUTH_SECRET}}
  PUBLIC_COLLAB_WS_URL: ${PUBLIC_COLLAB_WS_URL}
  HOCUSPOCUS_PORT: 1234
  COLLAB_HEALTH_PORT: 1235
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET:-wrkin}
  S3_FORCE_PATH_STYLE: 'true'
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [wrkin]

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [wrkin]

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET:-wrkin}
      "
    restart: 'no'
    logging: *default-logging
    networks: [wrkin]

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    command: ['node', '--import=tsx', 'scripts/migrate.ts']
    restart: 'no'
    logging: *default-logging
    networks: [wrkin]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      PORT: 3000
    expose:
      - '3000'
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks: [wrkin]

  collab:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    command: ['node', '--import=tsx', 'collab/server.ts']
    expose:
      - '1234'
      - '1235'
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://localhost:1235/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    networks: [wrkin]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - collab
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    logging: *default-logging
    networks: [wrkin]

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:

networks:
  wrkin:
    driver: bridge
